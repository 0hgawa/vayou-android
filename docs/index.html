<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=privacy/">
<link rel="canonical" href="https://0hgawa.github.io/vayou-android/privacy/">
<title>Vayou</title>
<style>
  :root { --bg: #ffffff; --fg: #1b1b1b; --accent: #b47300; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #e8e8e8; --accent: #e0a536; }
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    text-align: center;
    padding: 1.5rem;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
  <!--
    The policy moved to /privacy/ and this address stays put, because it is the one already
    registered with the store: a listing whose privacy policy answers 404 is the kind of thing that
    takes an app down, and the registration is not something to break while a review is in flight.
    The refresh carries anyone here straight through; the link below is for whoever it does not.
  -->
  <p>
    Vayou — <a href="privacy/">Privacy Policy · Política de Privacidade</a>
  </p>
</body>
</html>
