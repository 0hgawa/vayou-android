# Toolchain lives here because this machine has no JAVA_HOME; move it to a per-developer
# file the day a second machine builds this.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# Each library's R class holds only its own resources, so a module does not inherit the
# resource ids of everything it depends on.
android.nonTransitiveRClass=true
# Resource ids as non-final fields, which lets R8 shrink them and speeds up incremental builds.
android.nonFinalResIds=true

kotlin.code.style=official
